services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: waterly
      POSTGRES_PASSWORD: waterly-local-only
      POSTGRES_USER: waterly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterly -d waterly"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - waterly-postgres:/var/lib/postgresql/data

volumes:
  waterly-postgres:
