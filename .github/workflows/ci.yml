name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore Water.slnx
      - run: dotnet test Water.slnx -c Release --no-restore
      - run: dotnet ef migrations script --idempotent --project Water.Infrastructure --startup-project Water.Api --configuration Release --no-build
